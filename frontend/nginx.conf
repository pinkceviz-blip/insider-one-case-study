server {
 listen 80;
 root /usr/share/nginx/html;
 index index.html;
 location / { try_files $uri $uri/ /index.html; }
 location /api/ { proxy_pass http://api:8081; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; }
 location /health/ { proxy_pass http://api:8081; }
 location /metrics { proxy_pass http://api:8081; }
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
}
