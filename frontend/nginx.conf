server {
 listen 80;
 root /usr/share/nginx/html;
 index index.html;
 location / { try_files $uri $uri/ /index.html; }
 location /api/ { proxy_pass http://api:8081; proxy_set_header Host $http_host; proxy_http_version 1.1; proxy_set_header Connection ''; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; }
 location /health/ { proxy_pass http://api:8081; proxy_set_header Host $http_host; }
 location /metrics { proxy_pass http://api:8081; proxy_set_header Host $http_host; }
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
 add_header X-Frame-Options DENY always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
}
